<!DOCTYPE html>

        body { font-family: 'Inter', sans-serif; }
    </style>

<body class="bg-surface text-on-surface h-screen flex flex-col antialiased w-full max-w-md mx-auto relative md:border-x md:border-outline-variant">
<!-- Top Navigation AppBar - Excluded as per context rules for transactional linear flows, replaced with minimal header -->
<header class="w-full flex items-center justify-center py-6 px-margin-mobile border-b border-outline-variant bg-surface sticky top-0 z-10">
<img alt="Navjyoti Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-EVZbDvcYy3HGRdCj56OUpp5nLZi0ToWG_NpsjQ-5UjMtyvZPKenSlE3Dzbz6bRZ2YSECyPWimVJFxr2XipUFtfDMEM4v-tueFreFLZDj2qUt1fILEw-SNbiV0ktYof_Xmv7qsV6wTpBDlelIyXvnqdYs4cntONHboIU-B2fReOZ2UqbD8DKdZxUcVOmkQIqZYo5qr4p5y7zCNq2n5fXl0YKhEX6OpTpnsHi878h_OQKbYRUrX0llsMiWuxzXL0lUxNbVOfq5gUU"/>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto w-full flex flex-col px-margin-mobile py-6 space-y-6 pb-32">
<div class="space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Visitor Entry</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please fill in your details to proceed with the security check-in.</p>
</div>
<form action="#" class="space-y-5 flex flex-col">
<!-- Full Name -->
<div class="flex flex-col space-y-1 relative group">
<label class="font-label-bold text-label-bold text-on-surface-variant group-focus-within:text-secondary transition-colors" for="fullName">Full Name</label>
<input class="h-touch-target-min w-full rounded-lg border border-outline bg-surface-container-lowest px-4 font-body-lg text-body-lg text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none transition-all placeholder:text-on-surface-variant/50" id="fullName" name="fullName" placeholder="Enter your full name" type="text"/>
</div>
<!-- Mobile Number -->
<div class="flex flex-col space-y-1 relative group">
<label class="font-label-bold text-label-bold text-on-surface-variant group-focus-within:text-secondary transition-colors" for="mobileNumber">Mobile Number</label>
<div class="flex relative rounded-lg shadow-sm">
<span class="inline-flex items-center px-4 rounded-l-lg border border-r-0 border-outline bg-surface-container-low text-on-surface-variant font-body-lg text-body-lg">
                        +91
                    </span>
<input class="h-touch-target-min flex-1 min-w-0 block w-full rounded-none rounded-r-lg border border-outline bg-surface-container-lowest px-4 font-body-lg text-body-lg text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none transition-all placeholder:text-on-surface-variant/50" id="mobileNumber" name="mobileNumber" placeholder="98765 43210" type="tel"/>
</div>
</div>
<!-- Company / Organisation (Optional) -->
<div class="flex flex-col space-y-1 relative group">
<div class="flex justify-between items-end">
<label class="font-label-bold text-label-bold text-on-surface-variant group-focus-within:text-secondary transition-colors" for="company">Company / Organisation</label>
<span class="font-label-subtle text-label-subtle text-on-surface-variant/70">Optional</span>
</div>
<input class="h-touch-target-min w-full rounded-lg border border-outline bg-surface-container-lowest px-4 font-body-lg text-body-lg text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none transition-all placeholder:text-on-surface-variant/50" id="company" name="company" placeholder="e.g. Acme Corp" type="text"/>
</div>
<!-- Person to Meet (Combobox) -->
<div class="flex flex-col space-y-1 relative group z-20">
<label class="font-label-bold text-label-bold text-on-surface-variant group-focus-within:text-secondary transition-colors" for="personToMeet">Person to Meet</label>
<div class="relative w-full">
<input class="h-touch-target-min w-full rounded-lg border border-outline bg-surface-container-lowest pl-11 pr-4 font-body-lg text-body-lg text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none transition-all placeholder:text-on-surface-variant/50" id="personToMeet" name="personToMeet" placeholder="Search Employee..." type="text"/>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
</div>
</div>
</div>
<!-- Purpose of Meeting -->
<div class="flex flex-col space-y-1 relative group">
<label class="font-label-bold text-label-bold text-on-surface-variant group-focus-within:text-secondary transition-colors" for="purpose">Purpose of Meeting</label>
<textarea class="w-full rounded-lg border border-outline bg-surface-container-lowest p-4 font-body-lg text-body-lg text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none transition-all placeholder:text-on-surface-variant/50 resize-none min-h-[100px]" id="purpose" name="purpose" placeholder="Briefly describe the reason for your visit..." rows="3"></textarea>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full md:max-w-md md:left-1/2 md:-translate-x-1/2 p-margin-mobile bg-surface/90 backdrop-blur-md border-t border-outline-variant z-40">
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-lg font-label-bold text-label-bold uppercase tracking-wider flex items-center justify-center space-x-2 active:scale-[0.98] transition-transform hover:bg-primary/90 focus:outline-none focus:ring-4 focus:ring-primary/20 shadow-sm" type="button">
<span>Continue to Photo</span>
<span class="material-symbols-outlined" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</body></html>
